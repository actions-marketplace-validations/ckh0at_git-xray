# git-xray checks its own pull requests, using the action from this checkout.
name: git-xray PR check
on: pull_request
permissions:
  contents: read
  pull-requests: write
jobs:
  xray:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./
        with:
          package: .   # test the code in this PR, not the PyPI release
